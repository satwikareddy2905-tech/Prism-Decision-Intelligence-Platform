{% extends "base.html" %}

{% block title %}500 Server Error{% endblock %}

{% block content %}
<div class="card p-12 max-w-lg mx-auto my-12 text-center" style="max-width: 480px; margin: 4rem auto;">
  <div class="empty-state">
    <div class="empty-state-icon text-danger"><i class="bi bi-exclamation-triangle"></i></div>
    <h1 class="page-title text-xl font-bold mb-2">500 — Server Error</h1>
    <p class="empty-state-text mb-6">An unexpected error occurred while processing your request. Please try again later.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">Return to Dashboard</a>
  </div>
</div>
{% endblock %}
