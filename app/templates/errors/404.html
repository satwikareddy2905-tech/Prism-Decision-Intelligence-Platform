{% extends "base.html" %}

{% block title %}404 Page Not Found{% endblock %}

{% block content %}
<div class="card p-12 max-w-lg mx-auto my-12 text-center" style="max-width: 480px; margin: 4rem auto;">
  <div class="empty-state">
    <div class="empty-state-icon text-primary"><i class="bi bi-compass"></i></div>
    <h1 class="page-title text-xl font-bold mb-2">404 — Page Not Found</h1>
    <p class="empty-state-text mb-6">The page or resource you are looking for does not exist or may have been moved.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">Return to Dashboard</a>
  </div>
</div>
{% endblock %}
